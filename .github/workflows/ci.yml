name: ci

on:
  push:
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Install fuzz toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Verify arm64 runner
        run: test "$(uname -m)" = arm64
      - name: Signed AOT trampoline remap gate
        run: python3 tests/fixtures/trampoline/run.py
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Install native quality tools and SDL2 compatibility SDK
        run: brew install llvm@21 sdl2
      - name: Architecture conformance
        run: cargo xtask ci --artifacts artifacts/ci
      - name: Fuzz target build
        run: cargo xtask fuzz-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinzu-architecture-macos-arm64
          path: artifacts/ci

  portability:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: cargo check --workspace --all-targets
