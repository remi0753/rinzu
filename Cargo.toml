[workspace]
resolver = "3"
members = [
    "crates/abi",
    "crates/trace",
    "crates/compiler",
    "crates/codegen",
    "crates/runtime",
    "crates/bindgen",
    "crates/driver",
    "crates/conformance",
    "crates/xtask",
]
default-members = [
    "crates/abi",
    "crates/trace",
    "crates/compiler",
    "crates/codegen",
    "crates/runtime",
    "crates/bindgen",
    "crates/driver",
    "crates/conformance",
    "crates/xtask",
]
exclude = ["tests/runtime-model", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.103"
cc = "1.2.39"
cranelift-codegen = "0.136.1"
cranelift-control = "0.136.1"
cranelift-frontend = "0.136.1"
cranelift-jit = "0.136.1"
cranelift-module = "0.136.1"
cranelift-native = "0.136.1"
cranelift-object = "0.136.1"
libc = "0.2.176"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = { version = "0.10.9", features = ["asm"] }
target-lexicon = "0.13.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
