[package]
name = "rinzu-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
rinzu-trace = { path = "../crates/trace" }
rinzu-compiler = { path = "../crates/compiler" }

[[bin]]
name = "trace_schema"
path = "fuzz_targets/trace_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_formatter"
path = "fuzz_targets/source_formatter.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
